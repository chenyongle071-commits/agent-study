services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-study-day27-api
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.db
      APP_CHROMA_DIR: /app/data/chroma_db
      APP_AUTO_SEED: "true"
      APP_DEBUG_SQL: "false"
    ports:
      - "8000:8000"
    volumes:
      - day27_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  day27_data:
